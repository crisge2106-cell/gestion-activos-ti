<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar — Gestión de Activos TI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..110,400..700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14232b; --muted:#56666b; --paper:#f1f4f1; --card:#ffffff; --line:#cfd9d4;
    --brand:#0f5a4f; --brand-2:#17776a; --alert:#b42318; --ok:#1e6b45;
  }
  *{box-sizing:border-box;}
  html{color-scheme:light;}
  body{font-family:'Archivo', system-ui, sans-serif; background:var(--paper); color:var(--ink); min-height:100vh; min-height:100dvh; margin:0; display:flex; align-items:center; justify-content:center; padding:16px;}
  .box{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:clamp(22px,5vw,34px); width:100%; max-width:400px;}
  h1{font-size:21px; font-weight:700; font-stretch:105%; margin:0; line-height:1.2;}
  p.sub{color:var(--muted); font-size:13.5px; margin:4px 0 24px;}
  label{font-size:13px; font-weight:600; display:block; margin-bottom:6px;}
  input{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:4px; font:inherit; font-size:15px; margin-bottom:16px; background:#fff; color:var(--ink);}
  input:focus-visible, button:focus-visible{outline:2px solid var(--brand-2); outline-offset:2px;}
  button.btn{width:100%; background:var(--brand); color:#fff; border:0; padding:12px; border-radius:4px; font:inherit; font-weight:600; font-size:15px; cursor:pointer;}
  button.btn:hover{background:var(--brand-2);}
  button.btn:disabled{opacity:.6; cursor:default;}
  button.link{display:inline-block; margin-top:14px; background:none; border:0; padding:0; color:var(--brand); font:inherit; font-size:13.5px; text-decoration:underline; cursor:pointer;}
  .err{background:#fdf1f0; color:var(--alert); padding:9px 11px; border-radius:4px; font-size:13px; margin-bottom:14px; display:none;}
  .msg{background:#eef7f1; color:var(--ok); padding:9px 11px; border-radius:4px; font-size:13px; margin-bottom:14px; display:none;}
  .hidden{display:none;}
</style>
</head>
<body>
  <main class="box">
    <h1>Gestión de Activos TI</h1>
    <p class="sub">Axis Group</p>

    <div id="viewLogin">
      <div class="err" id="loginErr"></div>
      <label for="loginUser">Usuario</label>
      <input type="text" id="loginUser" autocomplete="username" placeholder="Ingresa tu usuario">
      <label for="loginPass">Contraseña</label>
      <input type="password" id="loginPass" autocomplete="current-password">
      <button class="btn" id="btnLogin" type="button">Ingresar</button>
      <button type="button" class="link" onclick="showView('forgot1')">¿Olvidaste tu contraseña?</button>
    </div>

    <div id="viewForgot1" class="hidden">
      <div class="msg" id="forgotMsg"></div>
      <p class="sub">Escribe el correo de recuperación asociado a tu usuario. Si está registrado, te enviaremos una contraseña temporal para ingresar.</p>
      <label for="forgotEmail">Correo de recuperación</label>
      <input type="email" id="forgotEmail" placeholder="tucorreo@empresa.com">
      <button class="btn" id="btnForgot" type="button">Enviar contraseña temporal</button>
      <button type="button" class="link" onclick="showView('login')">Volver a iniciar sesión</button>
    </div>
  </main>

<script>
function showView(name){
  document.getElementById('viewLogin').classList.add('hidden');
  document.getElementById('viewForgot1').classList.add('hidden');
  document.getElementById('view'+name.charAt(0).toUpperCase()+name.slice(1)).classList.remove('hidden');
}
function showErr(id, msg){ const el=document.getElementById(id); el.textContent=msg; el.style.display='block'; }
function hideErr(id){ document.getElementById(id).style.display='none'; }
function showMsg(id, msg){ const el=document.getElementById(id); el.textContent=msg; el.style.display='block'; }

document.getElementById('btnLogin').addEventListener('click', async ()=>{
  hideErr('loginErr');
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  if(!username || !password){ showErr('loginErr','Ingresa usuario y contraseña'); return; }
  try{
    const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password})});
    const data = await r.json();
    if(!r.ok){ showErr('loginErr', data.error || 'No se pudo iniciar sesión'); return; }
    window.location.href = '/';
  }catch(e){ showErr('loginErr', 'Error de conexión con el servidor'); }
});
document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('btnLogin').click(); });

document.getElementById('btnForgot').addEventListener('click', async ()=>{
  const email = document.getElementById('forgotEmail').value.trim();
  if(!email) return;
  const btn = document.getElementById('btnForgot');
  btn.disabled = true;
  try{
    const r = await fetch('/api/forgot-password', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email})});
    const data = await r.json();
    showMsg('forgotMsg', data.mensaje || data.error || 'Solicitud procesada');
  }catch(e){ showMsg('forgotMsg', 'Error de conexión con el servidor'); }
  finally{ btn.disabled = false; }
});
</script>
</body>
</html>
